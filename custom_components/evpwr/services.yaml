backfill:
  name: Backfill EV away trips
  description:
    Replays the recorded state-of-charge history and re-imports every away trip
    in the window. Returns the trips recorded and total kWh for each instance.
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: evpwr
    days:
      default: 30
      required: false
      selector:
        number:
          min: 1
          max: 365
          step: 1
          mode: box
